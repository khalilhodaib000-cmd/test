<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تَكْ | لوحة الكاشير الذكية</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #090616, #1b133a, #0f0c29);
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-card: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --purple-primary: #8b5cf6;
            --purple-hover: #7c3aed;
            --success: #10b981;
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.5);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 30px 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            margin: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* الشريط العلوي المطابق للصورة تماماً */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--glass-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 18px 25px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }
        .brand-section {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .brand-title {
            font-size: 18px;
            font-weight: 800;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .brand-title span {
            background: linear-gradient(135deg, #c4b5fd, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .brand-subtitle {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }
        
        .nav-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .branch-select {
            padding: 10px 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: white;
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }
        .branch-select option {
            background: #1e1b4b;
            color: white;
        }
        .analytics-btn {
            background: rgba(139, 92, 246, 0.2);
            color: #c4b5fd;
            border: 1px solid rgba(139, 92, 246, 0.3);
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .analytics-btn:hover { background: rgba(139, 92, 246, 0.35); }

        /* الكروت الزجاجية الرئيسية */
        .card {
            background: var(--glass-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 25px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }
        
        .section-tag {
            font-size: 11px;
            color: var(--purple-primary);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            margin: 0 0 5px 0;
        }
        .section-desc {
            font-size: 13px;
            color: var(--text-muted);
            margin: 0 0 20px 0;
        }

        .input-row {
            display: flex;
            gap: 12px;
        }
        input {
            flex: 1;
            padding: 14px 18px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }
        input::placeholder { color: rgba(255, 255, 255, 0.3); }
        input:focus { border-color: var(--purple-primary); box-shadow: 0 0 15px rgba(139, 92, 246, 0.2); }
        
        .btn-add {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: white;
            border: none;
            padding: 0 25px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(139, 92, 246, 0.4);
            transition: all 0.3s ease;
        }
        .btn-add:hover { opacity: 0.9; transform: translateY(-1px); }

        /* الجدول وتنسيق الصفوف */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 5px;
        }
        th, td {
            padding: 16px 12px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        th { 
            color: var(--text-muted); 
            font-weight: 600; 
            font-size: 12px; 
            letter-spacing: 0.5px;
        }
        
        .status-ready {
            background: rgba(16, 185, 129, 0.1);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.2);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }
        .status-cooking {
            background: rgba(245, 158, 11, 0.1);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.2);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }

        .btn-action-ready {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 12px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
            transition: all 0.2s;
        }
        .btn-action-ready:hover { opacity: 0.9; }

        .btn-action-qr {
            background: rgba(255, 255, 255, 0.06);
            color: white;
            border: 1px solid var(--glass-border);
            padding: 8px 16px;
            font-size: 12px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-left: 6px;
        }
        .btn-action-qr:hover { background: rgba(255, 255, 255, 0.12); }

        /* Modal */
        #qrModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(9, 6, 22, 0.8);
            backdrop-filter: blur(20px);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .modal-content {
            background: rgba(27, 19, 58, 0.8);
            backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            padding: 30px;
            border-radius: 24px;
            text-align: center;
            color: white;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            max-width: 300px;
            width: 100%;
        }
        #qrcodeContainer {
            background: white;
            padding: 15px;
            border-radius: 16px;
            display: inline-block;
            margin: 15px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- الشريط العلوي المطبّق بحسب الصورة -->
        <div class="top-nav">
            <div class="nav-actions">
                <a href="analytics.html" class="analytics-btn">
                    📊 التحليلات
                </a>
                <select id="branchSelector" class="branch-select" onchange="changeBranch()">
                    <option value="abdoun">فرع عبدون</option>
                    <option value="jubeiha">فرع الجبيهة</option>
                    <option value="dawood">فرع صويلح</option>
                </select>
            </div>
            
            <div class="brand-section">
                <div class="brand-title"><span>TACK POS</span> ⚡</div>
                <div class="brand-subtitle">نظام الطلبات الذكي</div>
            </div>
        </div>

        <!-- كارد إضافة الطلب -->
        <div class="card">
            <div class="section-tag">طلب جديد</div>
            <div class="section-title">إضافة طلب إلى قائمة الفرع</div>
            <div class="section-desc">أدخل رقم الطلب ليظهر فوراً ضمن الطلبات النشطة.</div>
            
            <div class="input-row">
                <input type="text" id="orderInput" placeholder="أدخل رقم الطلب (مثال: 101)">
                <button class="btn-add" onclick="addNewOrder()">إضافة الطلب</button>
            </div>
        </div>

        <!-- كارد عرض الطلبات النشطة -->
        <div class="card">
            <div class="section-tag">متابعة مباشرة</div>
            <div class="section-title" id="currentBranchTitle">الطلبات النشطة - فرع عبدون</div>
            
            <table>
                <thead>
                    <tr>
                        <th>رقم الطلب</th>
                        <th>الحالة</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="ordersTableBody">
                </tbody>
            </table>
        </div>
    </div>

    <!-- نافذة الـ QR -->
    <div id="qrModal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3 id="modalTitle" style="margin-top:0; font-size:16px;">رمز الاستجابة للطلب</h3>
            <div id="qrcodeContainer"></div>
            <p style="font-size: 11px; color: var(--text-muted); margin: 0;">اضغط في أي مكان للإغلاق</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, updateDoc, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC7IuqZfeJiBBD2KlH0Y1YFGRKQVE7Xrx4",
            authDomain: "test-f4f89.firebaseapp.com",
            projectId: "test-f4f89",
            storageBucket: "test-f4f89.firebasestorage.app",
            messagingSenderId: "933874949137",
            appId: "1:933874949137:web:0516c64d7496ab45fda5b0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentBranch = "abdoun";
        let unsubscribe = null;

        window.changeBranch = function() {
            const selector = document.getElementById('branchSelector');
            currentBranch = selector.value;
            const branchNames = {
                "abdoun": "فرع عبدون",
                "jubeiha": "فرع الجبيهة",
                "dawood": "فرع صويلح"
            };
            document.getElementById('currentBranchTitle').innerText = `الطلبات النشطة - ${branchNames[currentBranch]}`;
            loadOrdersForBranch(currentBranch);
        };

        window.addNewOrder = async function() {
            const orderInput = document.getElementById('orderInput');
            const orderId = orderInput.value.trim();
            if(!orderId) {
                alert('الرجاء إدخال رقم الطلب!');
                return;
            }

            const docId = `${currentBranch}_${orderId}`;

            try {
                await setDoc(doc(db, "orders", docId), {
                    orderId: orderId,
                    branch: currentBranch,
                    status: "cooking",
                    createdAt: new Date()
                });
                orderInput.value = "";
            } catch (e) {
                console.error("Error adding order: ", e);
                alert("حدث خطأ أثناء إضافة الطلب.");
            }
        };

        window.markReady = async function(docId) {
            try {
                await updateDoc(doc(db, "orders", docId), {
                    status: "ready"
                });
            } catch (e) {
                console.error("Error updating order: ", e);
            }
        };

        window.showQrCode = function(orderId) {
            const container = document.getElementById("qrcodeContainer");
            container.innerHTML = "";
            document.getElementById("modalTitle").innerText = `QR الطلب #${orderId}`;
            
            const customerUrl = window.location.origin + window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1) + `customer.html?order=${encodeURIComponent(orderId)}&branch=${encodeURIComponent(currentBranch)}`;                
            
            new QRCode(container, {
                text: customerUrl,
                width: 150,
                height: 150
            });

            document.getElementById("qrModal").style.display = "flex";
        };

        window.closeModal = function() {
            document.getElementById("qrModal").style.display = "none";
        };

        function loadOrdersForBranch(branch) {
            if (unsubscribe) unsubscribe();

            const q = query(collection(db, "orders"), where("branch", "==", branch));

            unsubscribe = onSnapshot(q, (snapshot) => {
                const tbody = document.getElementById('ordersTableBody');
                tbody.innerHTML = "";

                if (snapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: var(--text-muted);">لا توجد طلبات نشطة في هذا الفرع حالياً.</td></tr>`;
                    return;
                }

                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const docId = docSnap.id;
                    const isReady = data.status === "ready";

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td style="font-weight: 800; font-size: 16px; color: #fbbf24;">#${data.orderId}</td>
                        <td>
                            <span class="${isReady ? 'status-ready' : 'status-cooking'}">
                                ${isReady ? 'جاهز للاستلام' : 'قيد التحضير'}
                            </span>
                        </td>
                        <td>
                            <button class="btn-action-qr" onclick="showQrCode('${data.orderId}')">عرض QR</button>
                            ${!isReady ? `<button class="btn-action-ready" onclick="markReady('${docId}')">إرسال جاهز</button>` : ''}
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            });
        }

        loadOrdersForBranch(currentBranch);
    </script>
</body>
</html>
