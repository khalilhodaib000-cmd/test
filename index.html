<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تَكْ | لوحة الكاشير الذكية</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            --glass-bg: rgba(255, 255, 255, 0.07);
            --glass-card: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.12);
            --purple-primary: #8b5cf6;
            --purple-hover: #7c3aed;
            --success: #10b981;
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.6);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 30px 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 850px;
            margin: auto;
        }

        /* شريط علوي بنظام الزجاج (Glass Navbar) */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 18px 25px;
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .brand-logo {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .brand-logo span {
            background: linear-gradient(135deg, #c4b5fd, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .nav-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .branch-select {
            padding: 10px 16px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            color: white;
            font-size: 14px;
            outline: none;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }
        .branch-select option {
            background: #1e1b4b;
            color: white;
        }
        .analytics-btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid var(--glass-border);
            padding: 10px 18px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        .analytics-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        /* كروت الزجاج (Glass Cards) */
        .card {
            background: var(--glass-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 25px;
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            margin-bottom: 25px;
        }
        h3 { 
            color: #ffffff; 
            margin-top: 0; 
            font-size: 17px; 
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .input-row {
            display: flex;
            gap: 12px;
        }
        input {
            flex: 1;
            padding: 14px 18px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }
        input::placeholder { color: var(--text-muted); }
        input:focus { 
            border-color: var(--purple-primary); 
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.3);
        }
        .btn {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(139, 92, 246, 0.4);
            transition: all 0.3s ease;
        }
        .btn:hover { 
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 12px 25px rgba(139, 92, 246, 0.6);
        }

        /* الجدول العصري */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 16px 12px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        th { 
            color: var(--text-muted); 
            font-weight: 600; 
            font-size: 13px; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-ready {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 8px 16px;
            font-size: 13px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-ready:hover { background: rgba(16, 185, 129, 0.35); }
        
        .btn-qr {
            background: rgba(139, 92, 246, 0.2);
            color: #c4b5fd;
            border: 1px solid rgba(139, 92, 246, 0.3);
            padding: 8px 16px;
            font-size: 13px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-left: 5px;
        }
        .btn-qr:hover { background: rgba(139, 92, 246, 0.35); }

        /* نافذة الـ Modal بنظام الزجاج */
        #qrModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 12, 41, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .modal-content {
            background: rgba(30, 27, 75, 0.6);
            backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            padding: 35px;
            border-radius: 28px;
            text-align: center;
            color: white;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            max-width: 320px;
            width: 100%;
        }
        #qrcodeContainer {
            background: white;
            padding: 15px;
            border-radius: 20px;
            display: inline-block;
            margin: 20px 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- شريط علوي -->
        <div class="top-nav">
            <div class="brand-logo">⚡ <span>TACK POS</span></div>
            <div class="nav-actions">
                <select id="branchSelector" class="branch-select" onchange="changeBranch()">
                    <option value="abdoun">فرع عبدون</option>
                    <option value="jubeiha">فرع الجبيهة</option>
                    <option value="dawood">فرع صويلح</option>
                </select>
                <a href="analytics.html" class="analytics-btn">📊 التحليلات</a>
            </div>
        </div>

        <div class="card">
            <p style="margin-top: 0; color: var(--text-muted); font-size: 14px;">إصدار وتتبع طلبات الفرع المختار فورياً</p>
            <div class="input-row">
                <input type="text" id="orderInput" placeholder="أدخل رقم الطلب (مثال: 101)">
                <button class="btn" onclick="addNewOrder()">إضافة الطلب</button>
            </div>
        </div>

        <div class="card">
            <h3 id="currentBranchTitle">📋 الطلبات النشطة - فرع عبدون</h3>
            <table>
                <thead>
                    <tr>
                        <th>رقم الطلب</th>
                        <th>الحالة</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="ordersTableBody">
                </tbody>
            </table>
        </div>
    </div>

    <div id="qrModal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3 id="modalTitle" style="margin-bottom: 5px;">رمز الاستجابة للطلب</h3>
            <div id="qrcodeContainer"></div>
            <p style="font-size: 12px; color: var(--text-muted); margin: 0;">اضغط في أي مكان للإغلاق</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, updateDoc, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC7IuqZfeJiBBD2KlH0Y1YFGRKQVE7Xrx4",
            authDomain: "test-f4f89.firebaseapp.com",
            projectId: "test-f4f89",
            storageBucket: "test-f4f89.firebasestorage.app",
            messagingSenderId: "933874949137",
            appId: "1:933874949137:web:0516c64d7496ab45fda5b0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentBranch = "abdoun";
        let unsubscribe = null;

        window.changeBranch = function() {
            const selector = document.getElementById('branchSelector');
            currentBranch = selector.value;
            const branchNames = {
                "abdoun": "فرع عبدون",
                "jubeiha": "فرع الجبيهة",
                "dawood": "فرع صويلح"
            };
            document.getElementById('currentBranchTitle').innerText = `📋 الطلبات النشطة - ${branchNames[currentBranch]}`;
            loadOrdersForBranch(currentBranch);
        };

        window.addNewOrder = async function() {
            const orderInput = document.getElementById('orderInput');
            const orderId = orderInput.value.trim();
            if(!orderId) {
                alert('الرجاء إدخال رقم الطلب!');
                return;
            }

            const docId = `${currentBranch}_${orderId}`;

            try {
                await setDoc(doc(db, "orders", docId), {
                    orderId: orderId,
                    branch: currentBranch,
                    status: "cooking",
                    createdAt: new Date()
                });
                orderInput.value = "";
            } catch (e) {
                console.error("Error adding order: ", e);
                alert("حدث خطأ أثناء إضافة الطلب.");
            }
        };

        window.markReady = async function(docId) {
            try {
                await updateDoc(doc(db, "orders", docId), {
                    status: "ready"
                });
            } catch (e) {
                console.error("Error updating order: ", e);
            }
        };

        window.showQrCode = function(orderId) {
            const container = document.getElementById("qrcodeContainer");
            container.innerHTML = "";
            document.getElementById("modalTitle").innerText = `QR الطلب #${orderId}`;
            
            const customerUrl = window.location.origin + window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1) + `customer.html?order=${encodeURIComponent(orderId)}&branch=${encodeURIComponent(currentBranch)}`;                
            
            new QRCode(container, {
                text: customerUrl,
                width: 160,
                height: 160
            });

            document.getElementById("qrModal").style.display = "flex";
        };

        window.closeModal = function() {
            document.getElementById("qrModal").style.display = "none";
        };

        function loadOrdersForBranch(branch) {
            if (unsubscribe) unsubscribe();

            const q = query(collection(db, "orders"), where("branch", "==", branch));

            unsubscribe = onSnapshot(q, (snapshot) => {
                const tbody = document.getElementById('ordersTableBody');
                tbody.innerHTML = "";

                if (snapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: var(--text-muted);">لا توجد طلبات نشطة في هذا الفرع حالياً.</td></tr>`;
                    return;
                }

                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const docId = docSnap.id;
                    const isReady = data.status === "ready";

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td style="font-weight: 700; font-size: 18px; color: #c4b5fd;">#${data.orderId}</td>
                        <td>
                            <span style="padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; background: ${isReady ? 'rgba(16, 185, 129, 0.15)' : 'rgba(245, 158, 11, 0.15)'}; color: ${isReady ? '#34d399' : '#fbbf24'}; border: 1px solid ${isReady ? 'rgba(16, 185, 129, 0.3)' : 'rgba(245, 158, 11, 0.3)'};">
                                ${isReady ? '✅ جاهز للاستلام' : '⏳ قيد التحضير'}
                            </span>
                        </td>
                        <td>
                            <button class="btn-qr" onclick="showQrCode('${data.orderId}')">عرض QR</button>
                            ${!isReady ? `<button class="btn-ready" onclick="markReady('${docId}')">إرسال جاهز</button>` : ''}
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            });
        }

        loadOrdersForBranch(currentBranch);
    </script>
</body>
</html>
