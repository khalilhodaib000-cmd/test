<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الكاشير - إدارة الفروع والطلبات</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: auto;
        }
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .top-nav h2 {
            margin: 0;
            font-size: 20px;
            color: #60a5fa;
        }
        .nav-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .analytics-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.3s;
        }
        .analytics-btn:hover { background-color: var(--primary-hover); }

        /* اختيار الفرع */
        .branch-select {
            padding: 8px 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }

        .header-card, .orders-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }
        h3 { color: #60a5fa; margin-top: 0; }
        .input-row {
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            padding: 12px 15px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            outline: none;
        }
        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn:hover { background-color: var(--primary-hover); }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #334155;
        }
        th { color: var(--text-muted); }
        .btn-ready {
            background-color: var(--success);
            padding: 8px 12px;
            font-size: 14px;
        }
        .btn-ready:hover { background-color: #059669; }
        .btn-qr {
            background-color: #8b5cf6;
            padding: 8px 12px;
            font-size: 14px;
        }
        .btn-qr:hover { background-color: #7c3aed; }
        #qrModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            color: black;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- شريط علوي للتحكم، الفروع، والتحليلات -->
        <div class="top-nav">
            <h2>🍽️ لوحة الكاشير الذكية</h2>
            <div class="nav-actions">
                <select id="branchSelector" class="branch-select" onchange="changeBranch()">
                    <option value="abdoun">فرع عبدون</option>
                    <option value="jubeiha">فرع الجبيهة</option>
                    <option value="dawood">فرع صويلح</option>
                </select>
                <a href="analytics.html" class="analytics-btn">📊 التحليلات</a>
            </div>
        </div>

        <div class="header-card">
            <p style="margin-top: 0; color: var(--text-muted);">إصدار وتتبع طلبات الفرع المختار حالياً</p>
            <div class="input-row">
                <input type="text" id="orderInput" placeholder="أدخل رقم الطلب (مثال: 101)">
                <button class="btn" onclick="addNewOrder()">إضافة الطلب</button>
            </div>
        </div>

        <div class="orders-card">
            <h3 id="currentBranchTitle">📋 الطلبات النشطة - فرع عبدون</h3>
            <table>
                <thead>
                    <tr>
                        <th>رقم الطلب</th>
                        <th>الحالة</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="ordersTableBody">
                </tbody>
            </table>
        </div>
    </div>

    <div id="qrModal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3 id="modalTitle">QR Code للطلب</h3>
            <div id="qrcodeContainer"></div>
            <p style="font-size: 12px; color: #666; margin-top: 10px;">اضغط في أي مكان للإغلاق</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, updateDoc, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC7IuqZfeJiBBD2KlH0Y1YFGRKQVE7Xrx4",
            authDomain: "test-f4f89.firebaseapp.com",
            projectId: "test-f4f89",
            storageBucket: "test-f4f89.firebasestorage.app",
            messagingSenderId: "933874949137",
            appId: "1:933874949137:web:0516c64d7496ab45fda5b0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentBranch = "abdoun";
        let unsubscribe = null;

        window.changeBranch = function() {
            const selector = document.getElementById('branchSelector');
            currentBranch = selector.value;
            const branchNames = {
                "abdoun": "فرع عبدون",
                "jubeiha": "فرع الجبيهة",
                "dawood": "فرع صويلح"
            };
            document.getElementById('currentBranchTitle').innerText = `📋 الطلبات النشطة - ${branchNames[currentBranch]}`;
            loadOrdersForBranch(currentBranch);
        };

        window.addNewOrder = async function() {
            const orderInput = document.getElementById('orderInput');
            const orderId = orderInput.value.trim();
            if(!orderId) {
                alert('الرجاء إدخال رقم الطلب!');
                return;
            }

            // استخدام معرف فريد للطلب يدمج الفرع ورقم الطلب لضمان عدم تكرار الأرقام بين الفروع
            const docId = `${currentBranch}_${orderId}`;

            try {
                await setDoc(doc(db, "orders", docId), {
                    orderId: orderId,
                    branch: currentBranch,
                    status: "cooking",
                    createdAt: new Date()
                });
                orderInput.value = "";
            } catch (e) {
                console.error("Error adding order: ", e);
                alert("حدث خطأ أثناء إضافة الطلب.");
            }
        };

        window.markReady = async function(docId) {
            try {
                await updateDoc(doc(db, "orders", docId), {
                    status: "ready"
                });
            } catch (e) {
                console.error("Error updating order: ", e);
            }
        };

        window.showQrCode = function(orderId) {
            const container = document.getElementById("qrcodeContainer");
            container.innerHTML = "";
            document.getElementById("modalTitle").innerText = `QR Code للطلب #${orderId} (${currentBranch})`;
            
            const customerUrl = window.location.origin + window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1) + `customer.html?order=${encodeURIComponent(orderId)}&branch=${encodeURIComponent(currentBranch)}`;                
            
            new QRCode(container, {
                text: customerUrl,
                width: 180,
                height: 180
            });

            document.getElementById("qrModal").style.display = "flex";
        };

        window.closeModal = function() {
            document.getElementById("qrModal").style.display = "none";
        };

        function loadOrdersForBranch(branch) {
            if (unsubscribe) unsubscribe(); // إلغاء الاستماع للفرع السابق

            const q = query(collection(db, "orders"), where("branch", "==", branch));

            unsubscribe = onSnapshot(q, (snapshot) => {
                const tbody = document.getElementById('ordersTableBody');
                tbody.innerHTML = "";

                if (snapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: var(--text-muted);">لا توجد طلبات نشطة في هذا الفرع حالياً.</td></tr>`;
                    return;
                }

                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const docId = docSnap.id;
                    const isReady = data.status === "ready";

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td style="font-weight: bold; font-size: 18px;">#${data.orderId}</td>
                        <td>
                            <span style="padding: 5px 10px; border-radius: 12px; font-size: 13px; background: ${isReady ? '#10b981' : '#d97706'}; color: white;">
                                ${isReady ? '✅ جاهز للاستلام' : '⏳ قيد التحضير'}
                            </span>
                        </td>
                        <td>
                            <button class="btn btn-qr" onclick="showQrCode('${data.orderId}')">عرض QR</button>
                            ${!isReady ? `<button class="btn btn-ready" onclick="markReady('${docId}')">إرسال جاهز</button>` : ''}
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            });
        }

        // تحميل الطلبات للفرع الافتراضي عند فتح الصفحة
        loadOrdersForBranch(currentBranch);
    </script>
</body>
</html>
