<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خطوة | لوحة الكاشير الذكية</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
:root{--ink:#0b0914;--text:#f3f0fa;--muted:rgba(226,220,245,.56);--text-muted:rgba(226,220,245,.56);
--line:rgba(255,255,255,.08);--line-strong:rgba(255,255,255,.15);--surface:rgba(255,255,255,.035);
--violet:#a78bfa;--violet-deep:#7c4dff;--ok:#6ee7b7;--warn:#f2c46d;--danger:#fda4af;
--font:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif}
*{box-sizing:border-box}
html{background:var(--ink)}
body{margin:0;padding:32px 20px;min-height:100vh;font-family:var(--font);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--violet);outline-offset:3px}

/* الخلفية: وهج بنفسجي ناعم + دائرتان شفافتان في الزوايا */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:
 radial-gradient(560px 440px at 8% 13%,rgba(78,36,145,.36),transparent 70%),
 radial-gradient(680px 540px at 92% 78%,rgba(70,28,132,.32),transparent 70%),
 linear-gradient(135deg,#0c0a15 0%,#110e1d 50%,#0d0b17 100%)}
.bg i{position:absolute;border-radius:50%;background:radial-gradient(circle at 40% 40%,rgba(125,85,205,.17),rgba(80,50,150,.09));filter:blur(1.5px)}
.bg i:nth-child(1){width:270px;height:270px;top:-95px;right:-62px}
.bg i:nth-child(2){width:185px;height:185px;bottom:-55px;left:-32px}
.bg::after{content:"";position:absolute;inset:0;background:radial-gradient(700px 520px at 50% 45%,rgba(16,185,129,.26),transparent 70%);opacity:0}
body.flash-bg .bg::after{animation:flashGlow 1.1s ease-in-out infinite alternate}
@keyframes flashGlow{to{opacity:1}}
@keyframes orbA{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-45px,55px) scale(1.08)}}
@keyframes orbB{0%{transform:translate(0,0) scale(1)}100%{transform:translate(50px,-45px) scale(1.1)}}
.bg i:nth-child(1){animation:orbA 16s ease-in-out infinite alternate}
.bg i:nth-child(2){animation:orbB 20s ease-in-out infinite alternate}

.card{background:var(--surface);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--line);
border-radius:22px;padding:26px;margin-bottom:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 30px 60px -28px rgba(0,0,0,.7)}
h2,h3{margin:0;font-weight:500}
h3{font-size:16px;margin-bottom:6px}

.mark{width:30px;height:30px;border-radius:10px;display:inline-grid;place-items:center;flex:none;
background:linear-gradient(145deg,#9d7dff,#5a2fd6);box-shadow:0 8px 20px -6px rgba(124,77,255,.7),inset 0 1px 0 rgba(255,255,255,.3)}
.wordmark,.brand-logo{display:inline-flex;align-items:center;gap:10px;font-size:22px;font-weight:600;color:var(--text)}
.brand-logo em{font-style:normal;font-size:13px;font-weight:400;color:var(--muted);padding-right:12px;border-right:1px solid var(--line-strong)}

.top-nav{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:0 4px 22px;margin-bottom:28px;border-bottom:1px solid var(--line)}
.nav-actions{display:flex;gap:10px;align-items:center}
.branch-select,.analytics-btn,.back-btn{height:42px;padding:0 16px;background:rgba(255,255,255,.04);border:1px solid var(--line-strong);
border-radius:12px;color:var(--text);font-size:14px;font-weight:500;text-decoration:none;display:inline-flex;align-items:center;cursor:pointer;transition:background .2s,border-color .2s}
.branch-select:hover,.analytics-btn:hover,.back-btn:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.24)}
.branch-select option{background:#17132a;color:#fff}

input,textarea{width:100%;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:14px;color:var(--text);font-size:15px;padding:14px 16px;outline:none;transition:border-color .2s,box-shadow .2s}
input::placeholder,textarea::placeholder{color:rgba(226,220,245,.35)}
input:focus,textarea:focus{border-color:rgba(167,139,250,.7);box-shadow:0 0 0 4px rgba(124,77,255,.16)}
.btn,.submit-btn,.submit-feedback-btn,.enable-btn{border:0;color:#fff;font-weight:600;cursor:pointer;border-radius:14px;
background:linear-gradient(135deg,#8b5cf6,#6a3df0);box-shadow:0 10px 24px -10px rgba(124,77,255,.9),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .15s,filter .2s}
.btn:hover,.submit-btn:hover,.submit-feedback-btn:hover,.enable-btn:hover{filter:brightness(1.1)}
.btn:active,.submit-btn:active,.submit-feedback-btn:active,.enable-btn:active{transform:scale(.98)}
.btn{padding:0 26px;font-size:15px;white-space:nowrap}

table{width:100%;border-collapse:collapse;margin-top:12px}
th,td{padding:17px 12px;text-align:start;border-bottom:1px solid rgba(255,255,255,.05)}
tbody tr:last-child td{border-bottom:0}
th{color:var(--muted);font-weight:400;font-size:13px}
td:last-child,th:last-child{text-align:end}
.oid{font-weight:600;font-size:18px;color:#d6c9ff;font-variant-numeric:tabular-nums}

.stars-container{direction:ltr;display:inline-flex;gap:6px;font-size:34px;cursor:pointer;margin:10px 0 14px}
.star{color:rgba(255,255,255,.14);transition:color .2s,text-shadow .2s;line-height:1}
.star:hover{color:rgba(242,196,109,.55)}
.star.active{color:var(--warn);text-shadow:0 0 20px rgba(242,196,109,.4)}
.stars{color:var(--warn);letter-spacing:2px}.stars b{color:rgba(255,255,255,.14);font-weight:400}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.container{max-width:880px;margin:0 auto}
.lead{margin:0 0 16px;color:var(--muted);font-size:14px}
.input-row{display:flex;gap:12px}.input-row input{flex:1;width:auto}.input-row .btn{height:50px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:5px 13px;border-radius:999px;font-size:12.5px;font-weight:500;border:1px solid}
.chip i{width:6px;height:6px;border-radius:50%;background:currentColor}
.chip-cook{color:var(--warn);border-color:rgba(242,196,109,.25);background:rgba(242,196,109,.07)}
.chip-ready{color:var(--ok);border-color:rgba(110,231,183,.25);background:rgba(110,231,183,.07)}
.btn-qr,.btn-ready{padding:8px 16px;font-size:13px;font-weight:500;border-radius:11px;cursor:pointer;background:transparent;transition:background .2s}
.btn-qr{color:#d6c9ff;border:1px solid rgba(167,139,250,.35);margin-inline-start:8px}.btn-qr:hover{background:rgba(167,139,250,.12)}
.btn-ready{color:var(--ok);border:1px solid rgba(110,231,183,.35)}.btn-ready:hover{background:rgba(110,231,183,.12)}
#qrModal{display:none;position:fixed;inset:0;background:rgba(8,6,16,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);justify-content:center;align-items:center;z-index:999;padding:20px}
.modal-content{background:rgba(24,18,46,.7);backdrop-filter:blur(30px);border:1px solid var(--line-strong);padding:32px;border-radius:26px;text-align:center;max-width:320px;width:100%;box-shadow:0 30px 70px rgba(0,0,0,.6)}
#qrcodeContainer{background:#fff;padding:14px;border-radius:18px;display:inline-block;margin:20px 0}
.credit{width:100%;margin-top:32px;text-align:center;direction:ltr;font-size:12px;letter-spacing:.4px;color:rgba(226,220,245,.4)}
body{display:flex;flex-direction:column}.container{width:100%;flex:1}
    </style>
</head>
<body>
    <div class="bg" aria-hidden="true"><i></i><i></i></div>


    <div class="container">
        <!-- شريط علوي -->
        <div class="top-nav">
            <div class="brand-logo"><span class="mark"><svg viewBox="0 0 24 24" width="16" height="16" fill="#fff"><path d="M13.2 2 4.5 13.4h6L9.6 22l9-11.6h-6z"/></svg></span>خطوة<em>لوحة الكاشير</em></div>
            <div class="nav-actions">
                <select id="branchSelector" class="branch-select" onchange="changeBranch()">
                    <option value="abdoun">فرع عبدون</option>
                    <option value="jubeiha">فرع الجبيهة</option>
                    <option value="dawood">فرع صويلح</option>
                </select>
                <a href="analytics.html" class="analytics-btn">التحليلات</a>
            </div>
        </div>

        <div class="card">
            <p class="lead">إصدار وتتبع طلبات الفرع المختار فورياً</p>
            <div class="input-row">
                <input type="text" id="orderInput" placeholder="أدخل رقم الطلب (مثال: 101)">
                <button class="btn" onclick="addNewOrder()">إضافة الطلب</button>
            </div>
        </div>

        <div class="card">
            <h3 id="currentBranchTitle">الطلبات النشطة - فرع عبدون</h3>
            <table>
                <thead>
                    <tr>
                        <th>رقم الطلب</th>
                        <th>الحالة</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="ordersTableBody">
                </tbody>
            </table>
        </div>
    </div>

    <div id="qrModal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3 id="modalTitle" style="margin-bottom: 5px;">رمز الاستجابة للطلب</h3>
            <div id="qrcodeContainer"></div>
            <p style="font-size: 12px; color: var(--text-muted); margin: 0;">اضغط في أي مكان للإغلاق</p>
        </div>
    </div>

    <footer class="credit">Developed By: Khalil &amp; Walled</footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, updateDoc, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC7IuqZfeJiBBD2KlH0Y1YFGRKQVE7Xrx4",
            authDomain: "test-f4f89.firebaseapp.com",
            projectId: "test-f4f89",
            storageBucket: "test-f4f89.firebasestorage.app",
            messagingSenderId: "933874949137",
            appId: "1:933874949137:web:0516c64d7496ab45fda5b0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentBranch = "abdoun";
        let unsubscribe = null;

        window.changeBranch = function() {
            const selector = document.getElementById('branchSelector');
            currentBranch = selector.value;
            const branchNames = {
                "abdoun": "فرع عبدون",
                "jubeiha": "فرع الجبيهة",
                "dawood": "فرع صويلح"
            };
            document.getElementById('currentBranchTitle').innerText = `الطلبات النشطة - ${branchNames[currentBranch]}`;
            loadOrdersForBranch(currentBranch);
        };

        window.addNewOrder = async function() {
            const orderInput = document.getElementById('orderInput');
            const orderId = orderInput.value.trim();
            if(!orderId) {
                alert('الرجاء إدخال رقم الطلب!');
                return;
            }

            const docId = `${currentBranch}_${orderId}`;

            try {
                await setDoc(doc(db, "orders", docId), {
                    orderId: orderId,
                    branch: currentBranch,
                    status: "cooking",
                    createdAt: new Date()
                });
                orderInput.value = "";
            } catch (e) {
                console.error("Error adding order: ", e);
                alert("حدث خطأ أثناء إضافة الطلب.");
            }
        };

        window.markReady = async function(docId) {
            try {
                await updateDoc(doc(db, "orders", docId), {
                    status: "ready"
                });
            } catch (e) {
                console.error("Error updating order: ", e);
            }
        };

        window.showQrCode = function(orderId) {
            const container = document.getElementById("qrcodeContainer");
            container.innerHTML = "";
            document.getElementById("modalTitle").innerText = `QR الطلب #${orderId}`;
            
            const customerUrl = window.location.origin + window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1) + `customer.html?order=${encodeURIComponent(orderId)}&branch=${encodeURIComponent(currentBranch)}`;                
            
            new QRCode(container, {
                text: customerUrl,
                width: 160,
                height: 160
            });

            document.getElementById("qrModal").style.display = "flex";
        };

        window.closeModal = function() {
            document.getElementById("qrModal").style.display = "none";
        };

        function loadOrdersForBranch(branch) {
            if (unsubscribe) unsubscribe();

            const q = query(collection(db, "orders"), where("branch", "==", branch));

            unsubscribe = onSnapshot(q, (snapshot) => {
                const tbody = document.getElementById('ordersTableBody');
                tbody.innerHTML = "";

                if (snapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: var(--text-muted);">لا توجد طلبات نشطة في هذا الفرع حالياً.</td></tr>`;
                    return;
                }

                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const docId = docSnap.id;
                    const isReady = data.status === "ready";

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="oid">#${data.orderId}</td>
                        <td>
                            <span class="chip ${isReady ? 'chip-ready' : 'chip-cook'}"><i></i>${isReady ? 'جاهز للاستلام' : 'قيد التحضير'}</span>
                        </td>
                        <td>
                            <button class="btn-qr" onclick="showQrCode('${data.orderId}')">عرض QR</button>
                            ${!isReady ? `<button class="btn-ready" onclick="markReady('${docId}')">إرسال جاهز</button>` : ''}
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            });
        }

        loadOrdersForBranch(currentBranch);
    </script>
</body>
</html>
