<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحليلات وتقييمات المطعم</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        .container { max-width: 800px; margin: auto; }
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 16px;
            margin-bottom: 20px;
        }
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
            text-align: center;
        }
        .stats-number {
            font-size: 36px;
            font-weight: bold;
            color: #f59e0b;
            margin: 10px 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            text-align: right;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #334155;
        }
        th { color: var(--text-muted); text-align: right; }
        .back-btn {
            background-color: #3b82f6;
            color: white;
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-nav">
            <h2>📊 تحليلات وتقييمات الزبائن</h2>
            <a href="index.html" class="back-btn">⬅ العودة لوحة الكاشير</a>
        </div>

        <div class="card">
            <p style="color: var(--text-muted); margin: 0;">متوسط تقييم العملاء العام</p>
            <div class="stats-number" id="avgRating">0.0 ⭐</div>
            <p style="font-size: 13px; color: var(--text-muted);" id="totalReviews">إجمالي التقييمات: 0</p>
        </div>

        <div class="card" style="text-align: right;">
            <h3 style="color: #60a5fa; margin-top: 0;">💬 أحدث تعليقات وتقييمات الزبائن</h3>
            <table>
                <thead>
                    <tr>
                        <th>رقم الطلب</th>
                        <th>التقييم</th>
                        <th>التعليق</th>
                    </tr>
                </thead>
                <tbody id="feedbackTableBody">
                    <tr><td colspan="3" style="text-align: center; color: var(--text-muted);">جاري تحميل البيانات...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC7IuqZfeJiBBD2KlH0Y1YFGRKQVE7Xrx4",
            authDomain: "test-f4f89.firebaseapp.com",
            projectId: "test-f4f89",
            storageBucket: "test-f4f89.firebasestorage.app",
            messagingSenderId: "933874949137",
            appId: "1:933874949137:web:0516c64d7496ab45fda5b0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        onSnapshot(collection(db, "feedback"), (snapshot) => {
            const tbody = document.getElementById('feedbackTableBody');
            tbody.innerHTML = "";

            let totalScore = 0;
            let count = snapshot.size;

            if (count === 0) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: var(--text-muted);">لا توجد تقييمات حتى الآن.</td></tr>`;
                document.getElementById('avgRating').innerText = "0.0 ⭐";
                document.getElementById('totalReviews').innerText = "إجمالي التقييمات: 0";
                return;
            }

            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                totalScore += Number(data.rating || 0);

                const starsStr = "⭐".repeat(data.rating);
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="font-weight: bold;">#${data.orderId}</td>
                    <td>${starsStr} (${data.rating}/5)</td>
                    <td style="color: var(--text-muted);">${data.comment}</td>
                `;
                tbody.appendChild(tr);
            });

            const avg = (totalScore / count).toFixed(1);
            document.getElementById('avgRating').innerText = avg + " ⭐";
            document.getElementById('totalReviews').innerText = `إجمالي التقييمات: ${count} تقييم`;
        });
    </script>
</body>
</html>
