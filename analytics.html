<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحليلات والإحصائيات - Pager App</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #3b82f6;
            --success: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 950px;
            margin: auto;
        }
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        .app-header h1 {
            font-size: 20px;
            color: #60a5fa;
            margin: 0;
        }
        .back-btn {
            background-color: #334155;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.3s;
        }
        .back-btn:hover { background-color: #475569; }
        
        .title-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .title-card h2 {
            margin: 0;
            font-size: 22px;
            color: #60a5fa;
        }
        .badge-number {
            background-color: var(--primary);
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
        }
        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 5px;
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        .metric-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        .metric-title {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 8px;
        }
        .metric-value {
            font-size: 28px;
            font-weight: bold;
            color: var(--text-main);
        }
        .metric-trend {
            font-size: 12px;
            margin-top: 5px;
            color: var(--success);
        }
        .chart-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }
        .chart-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #60a5fa;
        }
        @media(max-width: 768px) {
            .metrics-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="app-header">
            <h1>📊 Pager App - التحليلات الحية</h1>
            <a href="index.html" class="back-btn">← عودة للوحة الكاشير</a>
        </div>

        <div class="title-card">
            <div>
                <h2>مؤشرات أداء المطعم (آخر 30 يوماً)</h2>
                <div class="subtitle">تتبع أداء الطلبات اليومية والمقارنة الزمنية الفورية من قاعدة البيانات.</div>
            </div>
            <div class="badge-number">30</div>
        </div>

        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-title">إجمالي طلبات الفترة</div>
                <div class="metric-value" id="totalOrdersVal">0</div>
                <div class="metric-trend">مسجل في النظام</div>
            </div>
            <div class="metric-card">
                <div class="metric-title">الطلبات الجاهزة</div>
                <div class="metric-value" id="readyOrdersVal" style="color: var(--success);">0</div>
                <div class="metric-trend">تم إنجازها</div>
            </div>
            <div class="metric-card">
                <div class="metric-title">نسبة إنجاز الطلبات</div>
                <div class="metric-value" id="completionRateVal">0%</div>
            </div>
        </div>

        <div class="chart-card">
            <div class="chart-title">حركة الطلبات اليومية — آخر 30 يوماً</div>
            <canvas id="thirtyDaysChart" height="120"></canvas>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC7IuqZfeJiBBD2KlH0Y1YFGRKQVE7Xrx4",
            authDomain: "test-f4f89.firebaseapp.com",
            projectId: "test-f4f89",
            storageBucket: "test-f4f89.firebasestorage.app",
            messagingSenderId: "933874949137",
            appId: "1:933874949137:web:0516c64d7496ab45fda5b0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // توليد تواريخ آخر 30 يوماً وتسميتها
        function getLast30Days() {
            const dates = [];
            for (let i = 29; i >= 0; i--) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                const formatted = d.toISOString().split('T')[0]; // صيغة YYYY-MM-DD
                dates.push({ key: formatted, label: d.toLocaleDateString('ar-JO', { month: 'short', day: 'numeric' }) });
            }
            return dates;
        }

        const daysList = getLast30Days();
        const ctx = document.getElementById('thirtyDaysChart').getContext('2d');
        
        const thirtyDaysChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: daysList.map(d => d.label),
                datasets: [{
                    label: 'عدد الطلبات',
                    data: new Array(30).fill(0),
                    backgroundColor: '#3b82f6',
                    borderRadius: 6
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { display: false } },
                scales: {
                    y: { 
                        beginAtZero: true,
                        ticks: { color: '#94a3b8', precision: 0 },
                        grid: { color: '#334155' }
                    },
                    x: {
                        ticks: { color: '#94a3b8', maxTicksLimit: 10 },
                        grid: { display: false }
                    }
                }
            }
        });

        onSnapshot(collection(db, "orders"), (snapshot) => {
            let total = snapshot.size;
            let readyCount = 0;
            let dailyCounts = {};

            daysList.forEach(d => dailyCounts[d.key] = 0);

            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                if (data.status === "ready") {
                    readyCount++;
                }

                if (data.createdAt && data.createdAt.toDate) {
                    const orderDate = data.createdAt.toDate().toISOString().split('T')[0];
                    if (dailyCounts.hasOwnProperty(orderDate)) {
                        dailyCounts[orderDate]++;
                    }
                }
            });

            document.getElementById('totalOrdersVal').innerText = total;
            document.getElementById('readyOrdersVal').innerText = readyCount;
            
            let rate = total > 0 ? Math.round((readyCount / total) * 100) : 0;
            document.getElementById('completionRateVal').innerText = rate + "%";

            const chartDataValues = daysList.map(d => dailyCounts[d.key]);
            thirtyDaysChart.data.datasets[0].data = chartDataValues;
            thirtyDaysChart.update();
        });
    </script>
</body>
</html>
