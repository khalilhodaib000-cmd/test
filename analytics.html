<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تَكْ | تحليلات وتقييمات الفروع</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            --glass-bg: rgba(255, 255, 255, 0.07);
            --glass-card: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.12);
            --purple-primary: #8b5cf6;
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.6);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 30px 20px;
            min-height: 100vh;
        }
        .container { max-width: 850px; margin: auto; }
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            padding: 18px 25px;
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .top-nav h2 {
            margin: 0;
            font-size: 20px;
            color: #ffffff;
        }
        .top-nav h2 span {
            background: linear-gradient(135deg, #c4b5fd, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .nav-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .branch-select {
            padding: 10px 16px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            color: white;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }
        .branch-select option {
            background: #1e1b4b;
            color: white;
        }
        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid var(--glass-border);
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }
        .back-btn:hover { background: rgba(255, 255, 255, 0.2); }
        
        .card {
            background: var(--glass-card);
            backdrop-filter: blur(20px);
            padding: 25px;
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            margin-bottom: 25px;
            text-align: center;
        }
        .stats-number {
            font-size: 42px;
            font-weight: 800;
            color: #fbbf24;
            margin: 10px 0;
            text-shadow: 0 0 20px rgba(251, 191, 36, 0.3);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            text-align: right;
        }
        th, td {
            padding: 16px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        th { color: var(--text-muted); text-align: right; font-size: 13px; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-nav">
            <h2>📊 <span>تحليلات التقييمات</span></h2>
            <div class="nav-actions">
                <select id="branchSelector" class="branch-select" onchange="changeBranchAnalytics()">
                    <option value="abdoun">فرع عبدون</option>
                    <option value="jubeiha">فرع الجبيهة</option>
                    <option value="dawood">فرع صويلح</option>
                </select>
                <a href="index.html" class="back-btn">⬅ لوحة الكاشير</a>
            </div>
        </div>

        <div class="card">
            <p style="color: var(--text-muted); margin: 0; font-size: 14px;" id="branchTitleStat">متوسط تقييم العملاء - فرع عبدون</p>
            <div class="stats-number" id="avgRating">0.0 ⭐</div>
            <p style="font-size: 13px; color: var(--text-muted);" id="totalReviews">إجمالي التقييمات: 0</p>
        </div>

        <div class="card" style="text-align: right;">
            <h3 style="color: #ffffff; margin-top: 0; font-size: 17px;">💬 أحدث تعليقات وتقييمات الفرع</h3>
            <table>
                <thead>
                    <tr>
                        <th>رقم الطلب</th>
                        <th>التقييم</th>
                        <th>التعليق</th>
                    </tr>
                </thead>
                <tbody id="feedbackTableBody">
                    <tr><td colspan="3" style="text-align: center; color: var(--text-muted);">جاري تحميل البيانات...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC7IuqZfeJiBBD2KlH0Y1YFGRKQVE7Xrx4",
            authDomain: "test-f4f89.firebaseapp.com",
            projectId: "test-f4f89",
            storageBucket: "test-f4f89.firebasestorage.app",
            messagingSenderId: "933874949137",
            appId: "1:933874949137:web:0516c64d7496ab45fda5b0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentBranch = "abdoun";
        let unsubscribe = null;

        const branchNames = {
            "abdoun": "فرع عبدون",
            "jubeiha": "فرع الجبيهة",
            "dawood": "فرع صويلح"
        };

        window.changeBranchAnalytics = function() {
            const selector = document.getElementById('branchSelector');
            currentBranch = selector.value;
            document.getElementById('branchTitleStat').innerText = `متوسط تقييم العملاء - ${branchNames[currentBranch]}`;
            loadFeedbackForBranch(currentBranch);
        };

        function loadFeedbackForBranch(branch) {
            if (unsubscribe) unsubscribe();

            const q = query(collection(db, "feedback"), where("branch", "==", branch));

            unsubscribe = onSnapshot(q, (snapshot) => {
                const tbody = document.getElementById('feedbackTableBody');
                tbody.innerHTML = "";

                let totalScore = 0;
                let count = snapshot.size;

                if (count === 0) {
                    tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: var(--text-muted);">لا توجد تقييمات لهذا الفرع حتى الآن.</td></tr>`;
                    document.getElementById('avgRating').innerText = "0.0 ⭐";
                    document.getElementById('totalReviews').innerText = "إجمالي التقييمات: 0";
                    return;
                }

                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    totalScore += Number(data.rating || 0);

                    const starsStr = "⭐".repeat(data.rating);
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td style="font-weight: 700; color: #c4b5fd;">#${data.orderId}</td>
                        <td>${starsStr} (${data.rating}/5)</td>
                        <td style="color: var(--text-muted);">${data.comment}</td>
                    `;
                    tbody.appendChild(tr);
                });

                const avg = (totalScore / count).toFixed(1);
                document.getElementById('avgRating').innerText = avg + " ⭐";
                document.getElementById('totalReviews').innerText = `إجمالي التقييمات: ${count} تقييم`;
            });
        }

        loadFeedbackForBranch(currentBranch);
    </script>
</body>
</html>
